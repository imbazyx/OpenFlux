name: Release

# A tag like v1.2.3 builds and signs the release APKs from this commit and
# publishes them as a GitHub release. "Run workflow" builds the same APKs as
# artifacts without publishing, for a dry run. The dry run signs too: skipping
# the keystore there would skip the part most likely to be wrong, and the build
# would fail anyway with an error that points at gradle instead of at the
# secret. It needs the same four Actions secrets as a real release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (tag the built commit as v<version>)'
        type: boolean
        default: false
      version:
        description: 'Version (1.2.3); required when publish is checked from a manual run'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # OpenFlux/ and shared/ are ordinary directories in this repository.
      # `submodules: recursive` would make checkout fail outright, and it is
      # the kind of setting that survives a structural change silently looking
      # harmless in review.

      - name: Version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          # The fallback must itself satisfy the check below, otherwise the
          # documented dry-run path (manual run, no version, no tag) dies here.
          # rev-list --count is unbounded, so it is folded into two digits: this
          # repo is already past 99 commits and "0.0.341" fails the patch group.
          if [ -z "$v" ]; then v="0.0.$(printf '%02d' $(( $(git rev-list --count HEAD) % 100 )))"; fi
          # Parts are bounded because versionCode is major*10000+minor*100+patch,
          # which collides for e.g. 1.100.0 and 2.0.0.
          if ! [[ "$v" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then echo "::error::version '$v' is not X.Y.Z"; exit 1; fi
          # The tag must name the version this tree declares.
          #
          # Two readers, and nothing compared them. CI takes the version from
          # the tag and overrides appVersion with -PappVersion; the Windows
          # client is built by hand and takes it from gradle.properties. Tag
          # v2.3.2 over a tree still saying 2.3.1 therefore publishes five APKs
          # called 2.3.2 while the desktop artifact is named OpenFlux-2.3.1.msi
          # - and every desktop user on 2.3.1 gets a 404 for OpenFlux-2.3.2.msi
          # with no fallback, permanently unable to update.
          declared=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d ' \r')
          if [ "$declared" != "$v" ]; then
            echo "::error::тег говорит $v, а gradle.properties говорит $declared"
            echo "::error::это одно число, объявленное один раз; разойтись они должны были в коммите, а не в релизе"
            exit 1
          fi
          # And it must be above the last one published, or Android refuses the
          # update (versionCode is not greater) while the app reports "up to
          # date" because compareVersions sees no difference.
          code=$(( ${v%%.*} * 10000 + $(echo "$v" | cut -d. -f2) * 100 + $(echo "$v" | cut -d. -f3) ))
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vE "^v$(echo "$v" | sed 's/[.[\*^$()+?{|]/\\&/g')$" | head -1 || true)
          if [ -n "$prev" ]; then
            p=${prev#v}
            pcode=$(( ${p%%.*} * 10000 + $(echo "$p" | cut -d. -f2) * 100 + $(echo "$p" | cut -d. -f3) ))
            if [ "$code" -le "$pcode" ]; then
              echo "::error::versionCode $code не больше, чем у $prev ($pcode): Android не примет обновление"
              exit 1
            fi
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v (versionCode $code, previous ${prev:-none}), core $(git -C OpenFlux rev-parse --short HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: OpenFlux/go.mod
          cache-dependency-path: OpenFlux/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # compileSdk/targetSdk come from gradle/libs.versions.toml and are 36.
          # Installing 35 here made the reference build fail with "Failed to find
          # target with hash string 'android-36'"; AGP only hides that locally by
          # downloading the missing platform on its own.
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build the core (gomobile)
        run: bash scripts/build-android-core.sh

      - name: Tests
        run: ./gradlew --no-daemon :shared:jvmTest

      # Signing is verified in a dry run too, and deliberately so. This step used
      # to be skipped unless publishing, on the reasoning that a dry run is
      # "unsigned". But then the dry run never exercised the part most likely to
      # be wrong - a missing or mis-encoded keystore, a wrong password, a wrong
      # alias - and it could not pass anyway: the build step below needs a
      # keystore, so "Build APKs" died with an unrelated error and the failure
      # pointed at gradle instead of at the secret that was actually absent.
      # A dry run that skips signing is not a rehearsal of a release.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set - add it under Settings -> Secrets and variables -> Actions"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openflux-release.jks"
          chmod 600 "$RUNNER_TEMP/openflux-release.jks"
          # A truncated blob decodes without complaint and fails much later,
          # inside keytool, as if the password were wrong. Open the store HERE,
          # where the error can still name the secret that is actually at fault.
          keytool -list -keystore "$RUNNER_TEMP/openflux-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::the decoded keystore does not open with ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS"; exit 1; }
          echo "keystore restored and opens with the configured password and alias"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/openflux-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion=${{ steps.version.outputs.value }} :androidApp:assembleRelease

      - name: Verify APK signatures
        run: |
          find androidApp/build/outputs/apk/release -name '*.apk' -print0 | \
            xargs -0 -r -n1 "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose

      # The pin, in the path that actually publishes.
      #
      # `apksigner verify` above checks that a signature is VALID, never WHO
      # signed. `keytool -list` earlier proves the keystore blob opens with the
      # configured password. Neither compares the fingerprint to anything, so a
      # rotated or substituted ANDROID_KEYSTORE_BASE64 builds five perfectly
      # self-consistent APKs signed by a certificate no installed copy has ever
      # seen - every job green, every user's update permanently refused, and the
      # only recovery is telling everyone to uninstall and lose their settings.
      #
      # The digest was already pinned in scripts/wsl-audit.sh, but that only ever
      # looks at a WSL build's dist/, never at what CI publishes.
      - name: Verify the signing certificate is the release one
        run: |
          PIN=60487280f6a493f6afd525d2727fa8b1772c217a24dd6ee148f90f3114a1f156
          found=$(find androidApp/build/outputs/apk/release -name '*.apk' -print0 | \
            xargs -0 -r -n1 "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs | \
            grep -oE '[0-9a-f]{64}' | sort -u)
          echo "сертификаты в сборке: $found"
          if [ "$found" != "$PIN" ]; then
            echo "::error::собран APK не тем ключом, чем подписан 2.3.1"
            echo "::error::ожидался $PIN"
            echo "::error::подобное делает невозможным обновление поверх установленного"
            exit 1
          fi
          echo "сертификат совпадает: все обновления поверх установленных останутся возможны"

      - name: Collect
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -name '*.apk' -print -exec cp {} dist/ \;
          for apk in dist/*.apk; do mv "$apk" "dist/OpenFluxAndroid-${{ steps.version.outputs.value }}-$(basename "$apk")"; done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFluxAndroid-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"
          else tag="v${{ inputs.version }}"; fi
          # --target, because gh otherwise creates the tag at the default
          # branch HEAD. On the manual-dispatch path the SHA that was built and
          # tested is not HEAD, so without this the published tag points at a
          # commit nobody built - the exact tag/artifact divergence that cut
          # 2.3.1. Asserted as well as passed: the flag is the fix, the check is
          # what proves the flag was honoured.
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "OpenFluxAndroid $tag" \
            --generate-notes \
            --notes "APK универсальный или под архитектуру устройства. Ядро: \`$(git -C OpenFlux rev-parse --short HEAD)\`. Контрольные суммы — в \`SHA256SUMS.txt\`."
