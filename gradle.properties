kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The one place the app version is written down.
#
# The Android app and the Windows client ship from the same release and are
# downloaded from the same page, so a visitor seeing 2.1.0 for one and 2.0.0 for
# the other has no way to tell which is current. They used to be written out
# separately, which is how the release scripts ended up two releases behind
# everything else. Bump it here and both follow; nothing else declares a
# default version.
appVersion=2.1.0
